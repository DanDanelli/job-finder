# Perfil de exemplo. Copie para perfis/<nome>.yaml (ignorado pelo git) e ajuste.
# No Marco 2 os campos de `dados` passam a vir do currículo.
nome: exemplo
telegram_chat_id: null

queries:
  - termo: Cloud Architect
    paises: []          # vazio = global
  - termo: DevOps Lead
    paises: [DE, NL, PT]

filtros:
  paises: [PT, ES, DE, NL, IE, GB]   # aceita presencial/híbrido nestes países
  remoto_a_partir_de: [PT]           # remoto: precisa aceitar quem mora em PT
  modalidades: [remoto, hibrido]
  tipos_contrato: [tempo_integral, contrato]
  salario_minimo: {minimo: 50000, moeda: EUR, periodo: ano}
  empresas_bloqueadas: []
  palavras_bloqueadas: [intern, estagio]
  idade_maxima_dias: 14

preferencias: >
  Prefiro empresas de produto a consultorias. Aberto a relocation dentro da Europa.

dados:
  resumo: Arquiteto cloud com foco em AWS e plataformas.
  cargos: [Cloud Architect, DevOps Engineer]
  senioridade: senior
  skills:
    - {nome: AWS, peso: 5}
    - {nome: Terraform, peso: 4}
  idiomas:
    - {codigo: pt, nivel: nativo}
    - {codigo: en, nivel: fluente}
