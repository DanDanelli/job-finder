services:
  job-finder:
    build: .
    image: job-finder:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      JOBFINDER_DATA_DIR: /data
      JOBFINDER_BACKUP_DIR: /backup
    ports:
      # Local only by default; expose it with a reverse proxy. For the local network too,
      # BIND_ADDRESS=0.0.0.0 in .env (plain HTTP: trusted networks only).
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/data
      # Daily database copies. Point BACKUP_HOST_DIR (in .env) at another disk than
      # ./data, e.g. BACKUP_HOST_DIR=/path/on/another/disk/job-finder.
      - ${BACKUP_HOST_DIR:-./data/backup}:/backup
