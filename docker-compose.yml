services:
  job-finder:
    build: .
    image: job-finder:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      JOBFINDER_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"  # só local; acesso externo via tailscale serve
    volumes:
      - ./data:/data
